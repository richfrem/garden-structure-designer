<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
<!-- SHOP BLUEPRINT: ELEVATION VIEW — Compound cut annotations, member dims, hardware callouts -->
<!-- SOURCE: geometry-calculations.json | scale=42px/ft | miter=28.71 | bevel=9.10 | pitch=4:12 -->
<!-- COORDINATE MAP: grade_y=700, post_top_y=350, beam_top_y=325, hub_apex_y=245 -->
<!-- TOPOLOGY_SKIP: 2D front elevation — only front 2 posts visible by design -->
<rect width="1200" height="900" fill="white"/>

<defs>
  <pattern id="blueprintGrid" width="42" height="42" patternUnits="userSpaceOnUse">
    <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#dbe8f5" stroke-width="0.5"/>
  </pattern>
  <marker id="aR" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#1a3a6a"/>
  </marker>
  <marker id="aL" markerWidth="8" markerHeight="8" refX="1" refY="3" orient="auto-start-reverse">
    <path d="M8,0 L8,6 L0,3 z" fill="#1a3a6a"/>
  </marker>
</defs>
<rect width="1200" height="900" fill="url(#blueprintGrid)"/>
<rect x="15" y="15" width="1170" height="870" fill="none" stroke="#1a3a6a" stroke-width="2.5"/>
<rect x="30" y="30" width="1140" height="840" fill="none" stroke="#1a3a6a" stroke-width="1"/>

<!-- Title block -->
<rect x="30" y="790" width="1140" height="80" fill="#e8eef8" stroke="#1a3a6a" stroke-width="1.5"/>
<line x1="30" y1="808" x2="1170" y2="808" stroke="#1a3a6a" stroke-width="1"/>
<line x1="600" y1="808" x2="600" y2="870" stroke="#1a3a6a" stroke-width="1"/>
<text x="315" y="803" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a3a6a">SHOP BLUEPRINT — ELEVATION VIEW</text>
<text x="315" y="822" font-family="monospace" font-size="12" text-anchor="middle" fill="#1a3a6a">10ft HEX CEDAR GAZEBO | Saanich BC | DWG NO: SB-02</text>
<text x="315" y="838" font-family="monospace" font-size="12" text-anchor="middle" fill="#1a3a6a">Scale: 3/4"=1'-0" | Post cut: 8'-4" | Total ht: 10'-7"</text>
<text x="315" y="854" font-family="monospace" font-size="12" text-anchor="middle" fill="#1a3a6a">Date: 2026-04-25 | Rev: 0</text>
<text x="885" y="822" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a3a6a">COMPOUND CUT — HIP RAFTER SEAT</text>
<text x="885" y="838" font-family="monospace" font-size="12" text-anchor="middle" fill="#1a3a6a">Miter: 28.7°  |  Bevel: 9.10°  |  Pitch: 4:12</text>
<text x="885" y="854" font-family="monospace" font-size="12" text-anchor="middle" fill="#1a3a6a">Rafter structural length: 5'-4" | With overhang: 6'-4"</text>
<text x="885" y="870" font-family="monospace" font-size="11" text-anchor="middle" fill="#c00">VERIFY: test seat cut on scrap 4×6 before cutting stock</text>

<!-- Ground line + hatching -->
<line x1="80" y1="700" x2="1120" y2="700" stroke="#1a3a6a" stroke-width="3"/>
<text x="600" y="720" font-family="monospace" font-size="11" text-anchor="middle" fill="#1a3a6a">FINISH GRADE</text>
<!-- Ground hatching -->
<line x1="80" y1="700" x2="80" y2="730" stroke="#1a3a6a" stroke-width="1.5"/>
<line x1="120" y1="700" x2="110" y2="730" stroke="#1a3a6a" stroke-width="1.5"/>
<line x1="200" y1="700" x2="185" y2="730" stroke="#1a3a6a" stroke-width="1.5"/>
<line x1="300" y1="700" x2="280" y2="730" stroke="#1a3a6a" stroke-width="1.5"/>
<line x1="400" y1="700" x2="380" y2="730" stroke="#1a3a6a" stroke-width="1.5"/>
<line x1="500" y1="700" x2="480" y2="730" stroke="#1a3a6a" stroke-width="1.5"/>
<line x1="600" y1="700" x2="580" y2="730" stroke="#1a3a6a" stroke-width="1.5"/>
<line x1="700" y1="700" x2="680" y2="730" stroke="#1a3a6a" stroke-width="1.5"/>
<line x1="800" y1="700" x2="780" y2="730" stroke="#1a3a6a" stroke-width="1.5"/>
<line x1="900" y1="700" x2="880" y2="730" stroke="#1a3a6a" stroke-width="1.5"/>
<line x1="1000" y1="700" x2="980" y2="730" stroke="#1a3a6a" stroke-width="1.5"/>
<line x1="1080" y1="700" x2="1060" y2="730" stroke="#1a3a6a" stroke-width="1.5"/>
<line x1="1120" y1="700" x2="1105" y2="730" stroke="#1a3a6a" stroke-width="1.5"/>

<!-- Concrete pier blocks (section view) -->
<!-- Left pier -->
<rect x="290" y="700" width="70" height="30" fill="#d0d0c8" stroke="#1a3a6a" stroke-width="2"/>
<line x1="290" y1="712" x2="360" y2="712" stroke="#1a3a6a" stroke-width="0.8"/>
<!-- Right pier -->
<rect x="790" y="700" width="70" height="30" fill="#d0d0c8" stroke="#1a3a6a" stroke-width="2"/>
<line x1="790" y1="712" x2="860" y2="712" stroke="#1a3a6a" stroke-width="0.8"/>

<!-- Left post (6×6 = 21px wide at scale) -->
<rect x="315" y="350" width="21" height="350" fill="#c8a96e" stroke="#1a3a6a" stroke-width="2"/>
<!-- cedar grain -->
<line x1="320" y1="360" x2="320" y2="698" stroke="#a08050" stroke-width="0.7" opacity="0.5"/>
<line x1="326" y1="360" x2="326" y2="698" stroke="#a08050" stroke-width="0.7" opacity="0.5"/>
<line x1="332" y1="360" x2="332" y2="698" stroke="#a08050" stroke-width="0.7" opacity="0.5"/>

<!-- Right post -->
<rect x="815" y="350" width="21" height="350" fill="#c8a96e" stroke="#1a3a6a" stroke-width="2"/>
<line x1="820" y1="360" x2="820" y2="698" stroke="#a08050" stroke-width="0.7" opacity="0.5"/>
<line x1="826" y1="360" x2="826" y2="698" stroke="#a08050" stroke-width="0.7" opacity="0.5"/>
<line x1="832" y1="360" x2="832" y2="698" stroke="#a08050" stroke-width="0.7" opacity="0.5"/>

<!-- Centre ghost post (dashed) -->
