<?xml version="1.0" encoding="UTF-8"?>
<!--
  DRAWING D01 — PLAN VIEW (Looking Down)
  Hexagonal Pavilion — Saanich, BC
  Scale: 1:24 (1 in = 2 ft)  |  Sheet: D01  |  Date: 2026-04-19
  All dimensions in INCHES unless noted.
  Geometry: Regular hexagon, circumradius = 60 in (5 ft), 6 posts at corners.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="-50 -50 1100 1100"
     font-family="Arial, Helvetica, sans-serif">

  <!-- Title block background -->
  <rect x="-50" y="-50" width="1100" height="1100" fill="#f8f7f4"/>

  <!-- ══════════════════════════════════════════════════
       BORDER & TITLE BLOCK
  ══════════════════════════════════════════════════ -->
  <rect x="-40" y="-40" width="1080" height="1080" fill="none" stroke="#000" stroke-width="3"/>
  <rect x="-40" y="960" width="1080" height="80" fill="#1a2744"/>
  <text x="500" y="990" text-anchor="middle" fill="white" font-size="22" font-weight="bold">HEXAGONAL PAVILION — PLAN VIEW (LOOKING DOWN)</text>
  <text x="500" y="1015" text-anchor="middle" fill="#aac8ff" font-size="15">Saanich, BC  |  Scale: 1:24 (1 in = 2 ft)  |  Sheet D01  |  Date: 2026-04-19</text>
  <text x="500" y="1033" text-anchor="middle" fill="#aac8ff" font-size="13">All dimensions in inches unless noted. Rough sawn cedar throughout.</text>

  <!-- ══════════════════════════════════════════════════
       SCALE LEGEND
  ══════════════════════════════════════════════════ -->
  <!-- SVG coordinate scale: 1 in real = 4 px  (so 1 ft = 48 px, 5 ft = 240 px) -->

  <!-- ══════════════════════════════════════════════════
       GEOMETRY SETUP
       Centre of hexagon at SVG (500, 480)
       Circumradius R = 60 in real = 240 px
       Post corners at angles 30,90,150,210,270,330 deg
       (flat side on top/bottom orientation)
  ══════════════════════════════════════════════════ -->

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arrowB" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="dimArrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
    <marker id="dimArrowR" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <!-- GROUND / GRADE HATCH -->
  <rect x="60" y="60" width="880" height="880" fill="#efe9d8" rx="4"/>

  <!-- Hexagon footprint outline (overhang edge = R + 12 in = 72 in = 288 px) -->
  <!-- Roof overhang perimeter (dashed) -->
  <!-- Post corner angles (30 deg increments starting at 30 deg) -->
  <!-- Corner posts at: 30,90,150,210,270,330 deg from centre (500,480) -->

  <!-- Helper: cos/sin for 30,90,150,210,270,330 (px, R=240):
    P1(30)  = 500+240cos30,  480-240sin30  = 500+207.85,480-120  = 707.85,360
    P2(90)  = 500+240cos90,  480-240sin90  = 500+0,    480-240   = 500,240
    P3(150) = 500+240cos150, 480-240sin150 = 500-207.85,480-120  = 292.15,360
    P4(210) = 500+240cos210, 480-240sin210 = 500-207.85,480+120  = 292.15,600
    P5(270) = 500+240cos270, 480-240sin270 = 500+0,    480+240   = 500,720
    P6(330) = 500+240cos330, 480-240sin330 = 500+207.85,480+120  = 707.85,600
  -->

  <!-- ROOF OVERHANG (R+12 in = 72 in = 288 px) dashed outline -->
  <!-- Overhang corners:
    P1 = 500+288*cos30,  480-288*sin30  = 500+249.42,480-144 = 749.42,336
    P2 = 500,480-288   = 500,192
    P3 = 500-249.42,   480-144 = 250.58,336
    P4 = 500-249.42,   480+144 = 250.58,624
    P5 = 500,480+288   = 500,768
    P6 = 500+249.42,   480+144 = 749.42,624
  -->
  <polygon points="749,336 500,192 251,336 251,624 500,768 749,624"
           fill="#d6c9a8" fill-opacity="0.4" stroke="#888" stroke-width="1.5" stroke-dasharray="8,6"/>

  <!-- RING BEAM top face fill -->
  <!-- Beam runs along hexagon sides. Beam width=7.25 in=29 px inset from each side -->
  <!-- Simplified: draw beam as thick polygon stroke -->
  <polygon points="708,360 500,240 292,360 292,600 500,720 708,600"
           fill="none" stroke="#7B5C2F" stroke-width="29"/>

  <!-- ROOF SURFACE FILL (cedar shingles hatching suggestion) -->
  <polygon points="708,360 500,240 292,360 292,600 500,720 708,600"
           fill="#c8b88a" fill-opacity="0.35"/>

  <!-- RAFTER LINES — from each beam midpoint to hub centre -->
  <!-- Beam midpoints (midpoint of each side of hexagon):
    M12 = midpt(P1,P2)  = (604,300)
    M23 = midpt(P2,P3)  = (396,300)
    M34 = midpt(P3,P4)  = (292,480)
    M45 = midpt(P4,P5)  = (396,660)
    M56 = midpt(P5,P6)  = (604,660)
    M61 = midpt(P6,P1)  = (708,480)
  -->
  <g stroke="#5A3E1B" stroke-width="14" stroke-linecap="round" opacity="0.85">
    <line x1="604" y1="300" x2="500" y2="480"/>
    <line x1="396" y1="300" x2="500" y2="480"/>
    <line x1="292" y1="480" x2="500" y2="480"/>
    <line x1="396" y1="660" x2="500" y2="480"/>
    <line x1="604" y1="660" x2="500" y2="480"/>
    <line x1="708" y1="480" x2="500" y2="480"/>
  </g>

  <!-- HUB at centre (min 8x8 = 32 px sq) -->
  <circle cx="500" cy="480" r="28" fill="#8B6914" stroke="#3d2b00" stroke-width="2.5"/>
  <text x="500" y="477" text-anchor="middle" fill="white" font-size="11" font-weight="bold">HUB</text>
  <text x="500" y="491" text-anchor="middle" fill="white" font-size="10">8x8 min</text>

  <!-- POSTS — 6x6 = 22 px sq, at each corner -->
  <g fill="#7B5C2F" stroke="#2d1a00" stroke-width="1.5">
    <!-- P1 (708,360) -->
    <rect x="697" y="349" width="22" height="22" rx="2"/>
    <!-- P2 (500,240) -->
    <rect x="489" y="229" width="22" height="22" rx="2"/>
    <!-- P3 (292,360) -->
    <rect x="281" y="349" width="22" height="22" rx="2"/>
    <!-- P4 (292,600) -->
    <rect x="281" y="589" width="22" height="22" rx="2"/>
    <!-- P5 (500,720) -->
    <rect x="489" y="709" width="22" height="22" rx="2"/>
    <!-- P6 (708,600) -->
    <rect x="697" y="589" width="22" height="22" rx="2"/>
  </g>

  <!-- POST LABELS -->
  <g font-size="11" text-anchor="middle" fill="#2d1a00" font-weight="bold">
    <text x="734" y="356">P1</text>
    <text x="500" y="220">P2</text>
    <text x="266" y="356">P3</text>
    <text x="266" y="616">P4</text>
    <text x="500" y="746">P5</text>
    <text x="734" y="616">P6</text>
  </g>

  <!-- FOOTING CIRCLES at each post (18 in dia = 72 px dia = r36) -->
  <g fill="none" stroke="#4a4a4a" stroke-width="1.5" stroke-dasharray="5,4">
    <circle cx="708" cy="360" r="36"/>
    <circle cx="500" cy="240" r="36"/>
    <circle cx="292" cy="360" r="36"/>
    <circle cx="292" cy="600" r="36"/>
    <circle cx="500" cy="720" r="36"/>
    <circle cx="708" cy="600" r="36"/>
  </g>

  <!-- CORBEL INDICATORS at each post (show 2 diagonal lines) -->
  <g stroke="#a05010" stroke-width="5" stroke-linecap="round" opacity="0.8">
    <!-- P1 corbels toward P2 and P6 beams -->
    <line x1="708" y1="360" x2="695" y2="338"/>
    <line x1="708" y1="360" x2="724" y2="372"/>
    <!-- P2 corbels -->
    <line x1="500" y1="240" x2="483" y2="252"/>
    <line x1="500" y1="240" x2="517" y2="252"/>
    <!-- P3 corbels -->
    <line x1="292" y1="360" x2="305" y2="338"/>
    <line x1="292" y1="360" x2="276" y2="372"/>
    <!-- P4 corbels -->
    <line x1="292" y1="600" x2="276" y2="588"/>
    <line x1="292" y1="600" x2="305" y2="622"/>
    <!-- P5 corbels -->
    <line x1="500" y1="720" x2="517" y2="708"/>
    <line x1="500" y1="720" x2="483" y2="708"/>
    <!-- P6 corbels -->
    <line x1="708" y1="600" x2="724" y2="588"/>
    <line x1="708" y1="600" x2="695" y2="622"/>
  </g>

  <!-- ══════════════════════════════════════════════════
       DIMENSIONS
  ══════════════════════════════════════════════════ -->

  <!-- Long diagonal dimension: P3 to P1 (horizontal, top) = 10 ft = 0 in -->
  <line x1="292" y1="195" x2="708" y2="195" stroke="#c0392b" stroke-width="1.5"
        marker-start="url(#arrowB)" marker-end="url(#arrow)"/>
  <line x1="292" y1="360" x2="292" y2="195" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="708" y1="360" x2="708" y2="195" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="500" y="188" text-anchor="middle" fill="#c0392b" font-size="14" font-weight="bold">10'-0" LONG DIAGONAL</text>

  <!-- Side length dimension (P1 to P2): 5'-0" -->
  <line x1="730" y1="360" x2="730" y2="240" stroke="#c0392b" stroke-width="1.5"
        marker-start="url(#arrowB)" marker-end="url(#arrow)"/>
  <text x="760" y="305" text-anchor="start" fill="#c0392b" font-size="13" font-weight="bold">5'-0"</text>
  <text x="760" y="320" text-anchor="start" fill="#c0392b" font-size="11">SIDE LENGTH</text>

  <!-- Inradius dimension: center to beam midpoint (right) -->
  <line x1="500" y1="480" x2="708" y2="480" stroke="#1a6e8f" stroke-width="1.2" stroke-dasharray="6,3"/>
  <text x="604" y="473" text-anchor="middle" fill="#1a6e8f" font-size="11">4'-4 1/2" (52")</text>
  <text x="604" y="489" text-anchor="middle" fill="#1a6e8f" font-size="10">INRADIUS (C to beam CL)</text>

  <!-- Post spacing note -->
  <text x="500" y="870" text-anchor="middle" fill="#333" font-size="13">POST SPACING: 5'-0" C-C (corner to corner along hexagon sides)</text>
  <text x="500" y="888" text-anchor="middle" fill="#333" font-size="13">FOOTING: 18" DIA CONCRETE CAISSON (TYP 6 PLACES) — SEE D06</text>

  <!-- North arrow -->
  <g transform="translate(820, 130)">
    <circle cx="0" cy="0" r="32" fill="white" stroke="#333" stroke-width="1.5"/>
    <polygon points="0,-28 -8,8 0,2 8,8" fill="#1a2744"/>
    <polygon points="0,28 -8,-8 0,-2 8,-8" fill="#ccc" stroke="#555" stroke-width="0.5"/>
    <text x="0" y="-10" text-anchor="middle" fill="white" font-size="14" font-weight="bold">N</text>
  </g>

  <!-- Scale bar -->
  <g transform="translate(80, 870)">
    <text x="0" y="-6" fill="#333" font-size="12" font-weight="bold">GRAPHIC SCALE: 1" = 2'-0"</text>
    <rect x="0" y="0" width="48" height="10" fill="#333"/>
    <rect x="48" y="0" width="48" height="10" fill="white" stroke="#333" stroke-width="1"/>
    <rect x="96" y="0" width="48" height="10" fill="#333"/>
    <rect x="144" y="0" width="48" height="10" fill="white" stroke="#333" stroke-width="1"/>
    <text x="0" y="22" fill="#333" font-size="11">0</text>
    <text x="44" y="22" fill="#333" font-size="11">2'</text>
    <text x="92" y="22" fill="#333" font-size="11">4'</text>
    <text x="140" y="22" fill="#333" font-size="11">6'</text>
    <text x="188" y="22" fill="#333" font-size="11">8'</text>
  </g>

  <!-- LEGEND -->
  <g transform="translate(80, 790)">
    <text x="0" y="0" fill="#333" font-size="13" font-weight="bold">LEGEND</text>
    <rect x="0" y="8" width="18" height="10" fill="#7B5C2F" stroke="#2d1a00" stroke-width="1"/>
    <text x="24" y="18" fill="#333" font-size="11">6x6 ROUGH SAWN CEDAR POST (TYP 6)</text>
    <line x1="0" y1="30" x2="18" y2="30" stroke="#7B5C2F" stroke-width="8"/>
    <text x="24" y="34" fill="#333" font-size="11">6x8 RING BEAM (TYP 6 BAYS)</text>
    <line x1="0" y1="48" x2="18" y2="48" stroke="#5A3E1B" stroke-width="6"/>
    <text x="24" y="52" fill="#333" font-size="11">4x6 RAFTER (TYP 6)</text>
    <circle cx="9" cy="65" r="9" fill="none" stroke="#4a4a4a" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="24" y="70" fill="#333" font-size="11">18" DIA CONCRETE CAISSON (TYP 6)</text>
    <line x1="0" y1="82" x2="18" y2="82" stroke="#a05010" stroke-width="4"/>
    <text x="24" y="86" fill="#333" font-size="11">4x4 CORBEL KNEE BRACE (TYP 12)</text>
  </g>

</svg>
