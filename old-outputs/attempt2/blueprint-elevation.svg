<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#fcfcfc" />
  
  <g transform="translate(300, 300)">
    <!-- Base Plate reference -->
    <line x1="-200" y1="0" x2="200" y2="0" stroke="#333" stroke-width="2"/>
    
    <!-- Elevation Posts (7'-10" clear + beam depth) -->
    <rect x="-136" y="-166" width="12" height="166" fill="none" stroke="#2980b9" stroke-width="2"/>
    <rect x="-6" y="-166" width="12" height="166" fill="none" stroke="#2980b9" stroke-width="2"/>
    <rect x="124" y="-166" width="12" height="166" fill="none" stroke="#2980b9" stroke-width="2"/>
    
    <!-- Ring Beam -->
    <rect x="-136" y="-166" width="272" height="14" fill="none" stroke="#2980b9" stroke-width="2"/>
    
    <!-- Roof Pitch (4:12) -->
    <polygon points="-150,-166 150,-166 0,-219" fill="none" stroke="#2980b9" stroke-width="2"/>
    <line x1="0" y1="-219" x2="0" y2="-166" stroke="#34495e" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="0" y1="-219" x2="-150" y2="-166" stroke="#34495e" stroke-width="1"/>
    <line x1="0" y1="-219" x2="150" y2="-166" stroke="#34495e" stroke-width="1"/>

    <!-- Vertical Dimension Lines -->
    <line x1="160" y1="0" x2="160" y2="-166" stroke="#e74c3c" stroke-width="1"/>
    <text x="165" y="-80" font-family="monospace" font-size="12" fill="#e74c3c">POST CUT: 8'-4"</text>
    
    <line x1="-170" y1="-166" x2="-170" y2="-219" stroke="#e74c3c" stroke-width="1"/>
    <text x="-260" y="-190" font-family="monospace" font-size="12" fill="#e74c3c">RISE: 1'-8"</text>
    
    <!-- Pitch Triangle -->
    <polygon points="20,-180 60,-180 60,-193" fill="none" stroke="#333" stroke-width="1"/>
    <text x="25" y="-170" font-family="monospace" font-size="10" fill="#333">12</text>
    <text x="65" y="-185" font-family="monospace" font-size="10" fill="#333">4</text>
  </g>
  
  <text x="20" y="30" font-family="monospace" font-size="16" font-weight="bold" fill="#2c3e50">DWG: EL-1 (ELEVATION - 10FT LIMIT)</text>
</svg>
