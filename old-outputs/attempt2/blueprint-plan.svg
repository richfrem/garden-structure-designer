<svg width="600" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#fcfcfc" />
  
  <g transform="translate(300, 300)">
    <!-- Grid/Reference Lines -->
    <line x1="-250" y1="0" x2="250" y2="0" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="0" y1="-250" x2="0" y2="250" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="5,5"/>
    
    <!-- Rough Sawn 6x6 Outline (Blueprint style Ring Beams) -->
    <polygon points="0,-150 130,-75 130,75 0,150 -130,75 -130,-75" fill="none" stroke="#2980b9" stroke-width="2"/>
    
    <!-- Hip Rafters -->
    <line x1="0" y1="0" x2="0" y2="-150" stroke="#34495e" stroke-width="1"/>
    <line x1="0" y1="0" x2="130" y2="-75" stroke="#34495e" stroke-width="1"/>
    <line x1="0" y1="0" x2="130" y2="75" stroke="#34495e" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="150" stroke="#34495e" stroke-width="1"/>
    <line x1="0" y1="0" x2="-130" y2="75" stroke="#34495e" stroke-width="1"/>
    <line x1="0" y1="0" x2="-130" y2="-75" stroke="#34495e" stroke-width="1"/>
    
    <!-- Post Detail Boxes (Exactly 6 identical posts!) -->
    <rect x="-6" y="-156" width="12" height="12" fill="#fff" stroke="#2c3e50" stroke-width="3"/> <!-- Top -->
    <rect x="124" y="-81" width="12" height="12" fill="#fff" stroke="#2c3e50" stroke-width="3"/> <!-- Top Right -->
    <rect x="124" y="69" width="12" height="12" fill="#fff" stroke="#2c3e50" stroke-width="3"/>  <!-- Bottom Right -->
    <rect x="-6" y="144" width="12" height="12" fill="#fff" stroke="#2c3e50" stroke-width="3"/>   <!-- Bottom -->
    <rect x="-136" y="69" width="12" height="12" fill="#fff" stroke="#2c3e50" stroke-width="3"/> <!-- Bottom Left -->
    <rect x="-136" y="-81" width="12" height="12" fill="#fff" stroke="#2c3e50" stroke-width="3"/><!-- Top Left -->

    <!-- Dimension Lines and Arrows -->
    <!-- Diagonal Dimension -->
    <line x1="-15" y1="-165" x2="-145" y2="-90" stroke="#e74c3c" stroke-width="1"/>
    <polygon points="-15,-165 -20,-160 -10,-160" fill="#e74c3c" transform="rotate(30 -15 -165)"/>
    <polygon points="-145,-90 -140,-95 -150,-95" fill="#e74c3c" transform="rotate(-150 -145 -90)"/>
    <text x="-100" y="-140" font-family="monospace" font-size="12" fill="#e74c3c" transform="rotate(30 -100 -140)">SPAN: 5&apos;-0&quot; (60&quot;) O.C.</text>

    <!-- Post to Post Diagonal -->
    <line x1="0" y1="-170" x2="0" y2="170" stroke="#e74c3c" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="5" y="-30" font-family="monospace" font-size="12" fill="#e74c3c" transform="rotate(-90 5 -30)">LONG DIAG: 10&apos;-0&quot; (120&quot;)</text>

    <!-- Blueprint Callout Note -->
    <line x1="-6" y1="-156" x2="-40" y2="-190" stroke="#7f8c8d" stroke-width="1"/>
    <text x="-150" y="-195" font-family="monospace" font-size="10" fill="#333">POST P1 (TYP x6): 6x6</text>
    <text x="-150" y="-185" font-family="monospace" font-size="10" fill="#333">CUT: 9&apos;-0&quot; EXACT</text>
  </g>
  
  <text x="20" y="30" font-family="monospace" font-size="16" font-weight="bold" fill="#2c3e50">DWG: FB-1 (FRAME BASE PLAN)</text>
  <text x="20" y="45" font-family="monospace" font-size="10" fill="#7f8c8d">NOTE: TOPOLOGY CODE AXIS VERIFIED: EXACTLY 6 RECT POSTS</text>
</svg>
